name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/panindar/contact-keeper

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build Docker image
        run: docker build -t contact-keeper:ci .

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Smoke test
        run: |
          docker run -d --name app --network host -e PORT=8080 \
            -e MONGO_URI=mongodb://localhost:27017/smoke $IMAGE:${{ github.sha }}
          for i in $(seq 1 15); do
            curl --fail --silent http://localhost:8080/api/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: docker push --all-tags $IMAGE

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_URL != ''
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Trigger Render deploy of this exact commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "${HOOK}&imgURL=ghcr.io%2Fpanindar%2Fcontact-keeper%3A${{ github.sha }}"

      - name: Wait until the app answers
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/health"; then exit 0; fi
            sleep 10
          done
          echo "App did not become healthy in time"
          exit 1